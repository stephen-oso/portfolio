<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <!-- Light gray app background -->
  <rect width="860" height="340" fill="#eef0f3" rx="12"/>

  <!-- Dark navy header -->
  <rect x="0" y="0" width="860" height="38" fill="#1c2434" rx="12"/>
  <rect x="0" y="24" width="860" height="14" fill="#1c2434"/>
  <text x="24" y="21" font-size="12" fill="#ffffff" font-weight="700">T2D Trial Pre-Screener</text>
  <text x="24" y="33" font-size="7.5" fill="#6b82a0">Clinical trial matching for Type 2 Diabetes</text>
  <rect x="744" y="11" width="96" height="17" rx="4" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
  <text x="792" y="23" font-size="7" fill="#8ba0b8" text-anchor="middle">Recent Searches</text>

  <!-- Action buttons -->
  <rect x="24" y="46" width="74" height="19" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="61" y="58.5" font-size="7.5" fill="#374151" text-anchor="middle">New Search</text>
  <rect x="106" y="46" width="82" height="19" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="147" y="58.5" font-size="7.5" fill="#374151" text-anchor="middle">Copy Results</text>
  <rect x="196" y="46" width="90" height="19" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
  <text x="241" y="58.5" font-size="7.5" fill="#374151" text-anchor="middle">Download CSV</text>

  <!-- Extracted Patient Profile card -->
  <rect x="24" y="74" width="812" height="78" rx="6" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/>
  <text x="40" y="91" font-size="6.5" fill="#3b82f6" font-weight="700" letter-spacing="0.08em">EXTRACTED PATIENT PROFILE</text>
  <!-- Row 1 labels -->
  <text x="40"  y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">AGE</text>
  <text x="150" y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">HBA1C</text>
  <text x="260" y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">BMI</text>
  <text x="370" y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">EGFR</text>
  <text x="500" y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">SYSTOLIC BP</text>
  <text x="628" y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">DIASTOLIC BP</text>
  <text x="756" y="105" font-size="6" fill="#9ca3af" letter-spacing="0.07em">WEIGHT</text>
  <!-- Row 1 values -->
  <text x="40"  y="118" font-size="10" fill="#111827" font-weight="500">48 yrs</text>
  <text x="150" y="118" font-size="10" fill="#111827" font-weight="500">7.6%</text>
  <text x="260" y="118" font-size="10" fill="#111827" font-weight="500">27.1</text>
  <text x="370" y="118" font-size="10" fill="#111827" font-weight="500">91 mL/min</text>
  <text x="500" y="118" font-size="10" fill="#9ca3af">—</text>
  <text x="628" y="118" font-size="10" fill="#9ca3af">—</text>
  <text x="756" y="118" font-size="10" fill="#9ca3af">—</text>
  <!-- Row 2 -->
  <text x="40"  y="134" font-size="6" fill="#9ca3af" letter-spacing="0.07em">MEDICATIONS</text>
  <text x="260" y="134" font-size="6" fill="#9ca3af" letter-spacing="0.07em">EXCLUSION FLAGS</text>
  <text x="40"  y="145" font-size="9" fill="#111827">Metformin 500mg BID</text>
  <text x="260" y="145" font-size="9" fill="#9ca3af">—</text>

  <!-- 10 Trials Found -->
  <text x="24" y="169" font-size="11" fill="#111827" font-weight="600">10 Trials Found</text>

  <!-- Trial card 1 — 90% -->
  <rect x="24" y="177" width="812" height="62" rx="6" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/>
  <text x="40" y="195" font-size="9" fill="#111827" font-weight="500">iCaReMe Global Registry: Multinational Real-world Evidence in Cardiorenal and Metabolic Diseases</text>
  <text x="822" y="196" font-size="12.5" fill="#16a34a" font-weight="700" text-anchor="end">90%</text>
  <text x="40" y="209" font-size="7.5" fill="#3b82f6">NCT03549754 ↗</text>
  <rect x="40" y="217" width="742" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="40" y="217" width="668" height="5" rx="2.5" fill="#22c55e"/>
  <rect x="40" y="227" width="70" height="13" rx="3" fill="#f3f4f6" stroke="#e2e5ea" stroke-width="1"/>
  <text x="75" y="236.5" font-size="7" fill="#6b7280" text-anchor="middle">Show criteria</text>

  <!-- Trial card 2 — 80% -->
  <rect x="24" y="247" width="812" height="62" rx="6" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/>
  <text x="40" y="265" font-size="9" fill="#111827" font-weight="500">A Study of HDM1005 in Participants With T2DM Not Controlled With Diet/Exercise or Metformin</text>
  <text x="822" y="266" font-size="12.5" fill="#16a34a" font-weight="700" text-anchor="end">80%</text>
  <text x="40" y="279" font-size="7.5" fill="#3b82f6">NCT07109700 ↗</text>
  <rect x="40" y="287" width="742" height="5" rx="2.5" fill="#e5e7eb"/>
  <rect x="40" y="287" width="594" height="5" rx="2.5" fill="#22c55e"/>
  <rect x="40" y="297" width="70" height="13" rx="3" fill="#f3f4f6" stroke="#e2e5ea" stroke-width="1"/>
  <text x="75" y="306.5" font-size="7" fill="#6b7280" text-anchor="middle">Show criteria</text>

  <!-- Trial card 3 — partial, 0% -->
  <rect x="24" y="317" width="812" height="62" rx="6" fill="#ffffff" stroke="#e2e5ea" stroke-width="1"/>
  <text x="40" y="334" font-size="9" fill="#111827" font-weight="500">Antidiabetic Effect of Olive Pomace Oil</text>
  <text x="822" y="335" font-size="12.5" fill="#dc2626" font-weight="700" text-anchor="end">0%</text>
</svg>
