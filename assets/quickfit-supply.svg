  <text x="790" y="158" font-size="11" fill="#e8521a" font-weight="600" text-anchor="middle">Wolseley</text>
  <text x="790" y="172" font-size="10" fill="#e8521a" text-anchor="middle">$14.80 total</text>

  <!-- Divider -->
