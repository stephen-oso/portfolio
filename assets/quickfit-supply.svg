  <!-- Row 1: Braided Supply Lines -->
  <text x="40" y="157" font-size="12" fill="#f0f0ed" font-weight="500">Braided Supply Lines (12")</text>
  <text x="40" y="172" font-size="10" fill="#9a9a94">Qty: 2</text>
  <!-- HD Pro -->
  <rect x="160" y="143" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="220" y="158" font-size="11" fill="#f0f0ed" text-anchor="middle">$8.97 ea</text>
  <text x="220" y="172" font-size="10" fill="#22c55e" text-anchor="middle">In stock</text>
  <!-- Wolseley -->
  <rect x="370" y="143" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="430" y="158" font-size="11" fill="#f0f0ed" text-anchor="middle">$7.40 ea</text>
  <text x="430" y="172" font-size="10" fill="#22c55e" text-anchor="middle">In stock</text>
  <!-- Emco -->
  <rect x="560" y="143" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="620" y="158" font-size="11" fill="#9a9a94" text-anchor="middle">$9.20 ea</text>
  <text x="620" y="172" font-size="10" fill="#fbbf24" text-anchor="middle">2 left</text>
  <!-- Selected badge -->
