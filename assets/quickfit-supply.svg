  <rect x="160" y="197" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="220" y="212" font-size="11" fill="#9a9a94" text-anchor="middle">Not stocked</text>
  <text x="220" y="226" font-size="10" fill="#5a5a56" text-anchor="middle">—</text>
  <rect x="370" y="197" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="430" y="212" font-size="11" fill="#f0f0ed" text-anchor="middle">$11.30 ea</text>
  <text x="430" y="226" font-size="10" fill="#22c55e" text-anchor="middle">In stock</text>
  <rect x="560" y="197" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="620" y="212" font-size="11" fill="#f0f0ed" text-anchor="middle">$10.90 ea</text>
  <text x="620" y="226" font-size="10" fill="#22c55e" text-anchor="middle">In stock</text>
  <rect x="736" y="197" width="108" height="36" rx="5" fill="#e8521a" opacity="0.15" stroke="#e8521a" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="790" y="212" font-size="11" fill="#e8521a" font-weight="600" text-anchor="middle">Emco</text>
  <text x="790" y="226" font-size="10" fill="#e8521a" text-anchor="middle">$21.80 total</text>

  <!-- Divider -->
  <line x1="40" y1="242" x2="860" y2="242" stroke="#1e1e1b" stroke-width="1"/>

