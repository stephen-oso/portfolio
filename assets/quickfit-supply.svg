  <text x="430" y="124" font-size="9" fill="#7a7a74" font-weight="600" letter-spacing="0.12em" text-anchor="middle">WOLSELEY</text>
  <text x="620" y="124" font-size="9" fill="#7a7a74" font-weight="600" letter-spacing="0.12em" text-anchor="middle">EMCO</text>
  <text x="790" y="124" font-size="9" fill="#e8521a" font-weight="600" letter-spacing="0.12em" text-anchor="middle">SELECTED</text>

  <!-- Divider -->
