  <text x="220" y="280" font-size="10" fill="#22c55e" text-anchor="middle">In stock</text>
  <rect x="370" y="251" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="430" y="266" font-size="11" fill="#f0f0ed" text-anchor="middle">$9.80 ea</text>
  <text x="430" y="280" font-size="10" fill="#22c55e" text-anchor="middle">In stock</text>
  <rect x="560" y="251" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
  <text x="620" y="266" font-size="11" fill="#9a9a94" text-anchor="middle">Not stocked</text>
  <text x="620" y="280" font-size="10" fill="#5a5a56" text-anchor="middle">—</text>
