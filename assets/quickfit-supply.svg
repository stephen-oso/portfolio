  <!-- Summary cols -->
  <text x="100" y="372" font-size="10" fill="#9a9a94" font-weight="600" letter-spacing="0.1em" text-anchor="middle">SUPPLIERS NEEDED</text>
  <text x="100" y="394" font-size="22" fill="#f0f0ed" font-weight="700" text-anchor="middle">2</text>
  <text x="100" y="412" font-size="10" fill="#7a7a74" text-anchor="middle">Wolseley + Emco</text>

  <line x1="190" y1="358" x2="190" y2="432" stroke="#2a2a27" stroke-width="1"/>

  <text x="310" y="372" font-size="10" fill="#9a9a94" font-weight="600" letter-spacing="0.1em" text-anchor="middle">PARTS TOTAL</text>
  <text x="310" y="394" font-size="22" fill="#f0f0ed" font-weight="700" text-anchor="middle">$94.30</text>
  <text x="310" y="412" font-size="10" fill="#7a7a74" text-anchor="middle">All 7 items sourced</text>

  <line x1="420" y1="358" x2="420" y2="432" stroke="#2a2a27" stroke-width="1"/>

  <text x="550" y="372" font-size="10" fill="#9a9a94" font-weight="600" letter-spacing="0.1em" text-anchor="middle">ESTIMATED DELIVERY</text>
  <text x="550" y="394" font-size="22" fill="#e8521a" font-weight="700" text-anchor="middle">28 min</text>
  <text x="550" y="412" font-size="10" fill="#7a7a74" text-anchor="middle">Runner dispatched on order</text>

  <line x1="660" y1="358" x2="660" y2="432" stroke="#2a2a27" stroke-width="1"/>

  <!-- CTA -->
  <rect x="690" y="363" width="154" height="48" rx="8" fill="#e8521a"/>
  <text x="767" y="383" font-size="12" fill="#ffffff" font-weight="600" text-anchor="middle">Confirm Order</text>
  <text x="767" y="400" font-size="10" fill="#ffffff" opacity="0.7" text-anchor="middle">15% delivery fee applies</text>

  <!-- Bottom label -->
  <text x="450" y="482" font-size="11" fill="#6a6a64" text-anchor="middle">QuickFit — Supply Chain Analyzer · Parts matched to real-time GTA supplier inventory</text>
</svg>
