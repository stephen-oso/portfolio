<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', system-ui, sans-serif">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.05"/>
    </pattern>
    <linearGradient id="glow2" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#e8521a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8521a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="#0d0d0b"/>
  <rect width="900" height="500" fill="url(#grid2)"/>
  <ellipse cx="450" cy="0" rx="500" ry="180" fill="url(#glow2)"/>

  <!-- Header bar -->
  <rect x="40" y="40" width="820" height="50" rx="10" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <circle cx="68" cy="65" r="6" fill="#e8521a" opacity="0.9"/>
  <text x="86" y="70" font-size="12" fill="#f0f0ed" font-weight="500" opacity="0.9">Supply Chain Analyzer</text>
  <text x="450" y="70" font-size="11" fill="#9a9a94" text-anchor="middle">7 parts · Matching against GTA suppliers in real time</text>
  <rect x="730" y="52" width="118" height="26" rx="5" fill="#22c55e" opacity="0.12" stroke="#22c55e" stroke-width="0.8" stroke-opacity="0.4"/>
  <circle cx="748" cy="65" r="3" fill="#22c55e"/>
  <text x="758" y="70" font-size="11" fill="#22c55e" font-weight="500">All items available</text>

  <!-- Supplier columns header -->
