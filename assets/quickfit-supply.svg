  <text x="40" y="280" font-size="10" fill="#9a9a94">1-1/4" plastic · Qty: 1</text>
  <rect x="160" y="251" width="120" height="36" rx="5" fill="#1a1a18" stroke="#2a2a27" stroke-width="0.5"/>
