  <text x="790" y="266" font-size="11" fill="#e8521a" font-weight="600" text-anchor="middle">Wolseley</text>
  <text x="790" y="280" font-size="10" fill="#e8521a" text-anchor="middle">$9.80 total</text>

  <!-- Divider -->
  <line x1="40" y1="296" x2="860" y2="296" stroke="#1e1e1b" stroke-width="1"/>

  <!-- Rows hint -->
  <text x="450" y="324" font-size="11" fill="#5a5a56" text-anchor="middle">+ 4 more items matched</text>

  <!-- Summary footer -->
