<svg viewBox="0 0 860 340" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <rect width="860" height="340" fill="#0e0e0d" rx="12"/>

  <!-- Top nav -->
  <text x="28" y="30" font-size="12" fill="#ffffff" font-weight="600" letter-spacing="-0.01em">MachineLine</text>
  <rect x="766" y="16" width="72" height="20" rx="4" fill="#1e1e1c" stroke="#2a2a27" stroke-width="1"/>
  <text x="802" y="29" font-size="7.5" fill="#9ca3af" text-anchor="middle">New plan →</text>

  <!-- Risk + status row -->
  <text x="28" y="56" font-size="7.5" fill="#ef4444" font-weight="600">1 risk flagged</text>
  <rect x="120" y="45" width="62" height="16" rx="8" fill="#1e1e1c"/>
  <text x="151" y="56.5" font-size="7" fill="#d1d5db" text-anchor="middle">Plan ready</text>
  <text x="192" y="56.5" font-size="8" fill="#22c55e">✓</text>
  <text x="200" y="56.5" font-size="7" fill="#22c55e">Data verified 2 August 2026</text>
  <text x="802" y="56" font-size="7.5" fill="#5a5a56" text-anchor="end">View warnings →</text>

  <!-- Plan description -->
  <text x="28" y="80" font-size="9" fill="#ffffff" font-weight="600">Small-scale sachet water purification and bottling · Nigeria · 6,700 litres/day · Budget $5,000–$15,000</text>

  <!-- Price toggle -->
  <rect x="28" y="90" width="124" height="18" rx="4" fill="#1e1e1c" stroke="#3a3a37" stroke-width="1"/>
  <text x="90" y="102" font-size="7.5" fill="#f0f0ed" text-anchor="middle">New: $11,500–$22,500</text>
  <rect x="158" y="90" width="124" height="18" rx="4" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <text x="220" y="102" font-size="7.5" fill="#5a5a56" text-anchor="middle">Used: $5,980–$12,500</text>

  <!-- Cost box -->
  <rect x="28" y="116" width="804" height="76" rx="6" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <text x="46" y="136" font-size="7" fill="#6b7280" letter-spacing="0.06em">ESTIMATED TOTAL STARTUP COST</text>
  <text x="46" y="160" font-size="26" fill="#ffffff" font-weight="700" letter-spacing="-0.03em">$39,100 – $57,800</text>
  <!-- Breakdown -->
  <text x="46"  y="177" font-size="7.5" fill="#5a5a56">Machines</text>
  <text x="170" y="177" font-size="7.5" fill="#9a9a95">$11,500–$22,500</text>
  <text x="380" y="177" font-size="7.5" fill="#5a5a56">Space (1 yr)</text>
  <text x="470" y="177" font-size="7.5" fill="#9a9a95">$25,000–$30,000/year</text>
  <text x="660" y="177" font-size="7.5" fill="#5a5a56">Working capital</text>
  <text x="752" y="177" font-size="7.5" fill="#9a9a95">$2,300–$4,500</text>

  <!-- Production flow label -->
  <text x="28" y="214" font-size="7" fill="#6b7280" letter-spacing="0.1em">PRODUCTION FLOW</text>

  <!-- Step 1 -->
  <rect x="28" y="222" width="176" height="82" rx="6" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <circle cx="44" cy="237" r="8" fill="#1e1e1c"/>
  <text x="44" y="241" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
  <text x="100" y="252" font-size="10" fill="#f0f0ed" font-weight="600" text-anchor="middle">Borehole Pump</text>
  <text x="100" y="266" font-size="7.5" fill="#5a5a56" text-anchor="middle">Water source</text>
  <text x="100" y="278" font-size="7.5" fill="#5a5a56" text-anchor="middle">(borehole / municipal)</text>
  <text x="100" y="292" font-size="7.5" fill="#4a4a47" text-anchor="middle">→ Storage tank</text>

  <text x="210" y="264" font-size="14" fill="#2a2a27" text-anchor="middle">→</text>

  <!-- Step 2 -->
  <rect x="222" y="222" width="176" height="82" rx="6" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <circle cx="238" cy="237" r="8" fill="#1e1e1c"/>
  <text x="238" y="241" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
  <text x="310" y="252" font-size="10" fill="#f0f0ed" font-weight="600" text-anchor="middle">5-Stage RO Filter</text>
  <text x="310" y="266" font-size="7.5" fill="#5a5a56" text-anchor="middle">Raw water</text>
  <text x="310" y="278" font-size="7.5" fill="#5a5a56" text-anchor="middle">→ Purified water</text>
  <text x="310" y="292" font-size="7.5" fill="#4a4a47" text-anchor="middle">holding tank</text>

  <text x="404" y="264" font-size="14" fill="#2a2a27" text-anchor="middle">→</text>

  <!-- Step 3 -->
  <rect x="416" y="222" width="176" height="82" rx="6" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <circle cx="432" cy="237" r="8" fill="#1e1e1c"/>
  <text x="432" y="241" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
  <text x="504" y="252" font-size="10" fill="#f0f0ed" font-weight="600" text-anchor="middle">UV Sterilizer</text>
  <text x="504" y="266" font-size="7.5" fill="#5a5a56" text-anchor="middle">Purified water</text>
  <text x="504" y="278" font-size="7.5" fill="#5a5a56" text-anchor="middle">→ Sterile water line</text>

  <text x="598" y="264" font-size="14" fill="#2a2a27" text-anchor="middle">→</text>

  <!-- Step 4 -->
  <rect x="610" y="222" width="222" height="82" rx="6" fill="#141412" stroke="#2a2a27" stroke-width="1"/>
  <circle cx="626" cy="237" r="8" fill="#1e1e1c"/>
  <text x="626" y="241" font-size="8" fill="#ffffff" text-anchor="middle" font-weight="700">4</text>
  <text x="721" y="252" font-size="10" fill="#f0f0ed" font-weight="600" text-anchor="middle">Sachet Fill &amp; Sealing</text>
  <text x="721" y="266" font-size="7.5" fill="#5a5a56" text-anchor="middle">Sterile water line</text>
  <text x="721" y="278" font-size="7.5" fill="#5a5a56" text-anchor="middle">→ Finished sachets</text>
  <text x="721" y="292" font-size="7.5" fill="#4a4a47" text-anchor="middle">6,700 units / day</text>

  <!-- Bottom note -->
  <text x="28" y="326" font-size="7" fill="#3a3a37">Min. floor space: 1,500 sq ft  ·  Power: 30KVA generator recommended</text>
</svg>
