<svg viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans', system-ui, sans-serif">

  <rect width="900" height="460" fill="#0a0a10"/>

  <!-- Header -->
  <text x="48" y="48" font-size="11" fill="#b794f4" font-weight="600" letter-spacing="0.16em">PLATFORM LANDSCAPE</text>
  <text x="48" y="68" font-size="13" fill="#8a7aa0">FanBand occupies a quadrant no existing platform owns.</text>

  <!-- Axes -->
  <line x1="160" y1="96" x2="160" y2="390" stroke="#2a2040" stroke-width="1.5"/>
  <line x1="160" y1="390" x2="840" y2="390" stroke="#2a2040" stroke-width="1.5"/>

  <!-- Y axis label -->
  <text x="32" y="248" font-size="12" fill="#6a5a88" font-weight="600" letter-spacing="0.1em" text-anchor="middle" transform="rotate(-90, 32, 248)">COMMUNITY DEPTH</text>
  <text x="148" y="106" font-size="11" fill="#4a4060" text-anchor="end">High</text>
  <text x="148" y="388" font-size="11" fill="#4a4060" text-anchor="end">Low</text>

  <!-- X axis label -->
  <text x="500" y="432" font-size="12" fill="#6a5a88" font-weight="600" letter-spacing="0.1em" text-anchor="middle">DISCOVERY REACH</text>
  <text x="170" y="408" font-size="11" fill="#4a4060">Low</text>
  <text x="834" y="408" font-size="11" fill="#4a4060" text-anchor="end">High</text>

  <!-- Subtle quadrant lines -->
  <line x1="160" y1="243" x2="840" y2="243" stroke="#1e1a2a" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="500" y1="96" x2="500" y2="390" stroke="#1e1a2a" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- PLATFORMS as clean circles with external labels -->

  <!-- Spotify / Apple Music — high discovery, low community -->
  <circle cx="740" cy="330" r="22" fill="#1DB954" opacity="0.18" stroke="#1DB954" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="740" y="334" font-size="12" fill="#1DB954" font-weight="600" text-anchor="middle">&#9654;</text>
  <text x="740" y="368" font-size="12" fill="#4a8a5a" text-anchor="middle">Spotify</text>
  <text x="740" y="383" font-size="11" fill="#3a5a4a" text-anchor="middle">Apple Music</text>

  <!-- TikTok / Instagram — high discovery, medium community -->
  <circle cx="710" cy="190" r="22" fill="#e040fb" opacity="0.15" stroke="#e040fb" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="710" y="196" font-size="13" fill="#e040fb" font-weight="700" text-anchor="middle">✦</text>
  <text x="766" y="186" font-size="12" fill="#a050c0" text-anchor="start">TikTok</text>
  <text x="766" y="201" font-size="11" fill="#804090" text-anchor="start">Instagram</text>

  <!-- Bandcamp — low discovery, high community -->
  <circle cx="260" cy="148" r="20" fill="#1da0c3" opacity="0.15" stroke="#1da0c3" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="260" y="153" font-size="12" fill="#1da0c3" font-weight="600" text-anchor="middle">B</text>
  <text x="260" y="182" font-size="12" fill="#2a7090" text-anchor="middle">Bandcamp</text>

  <!-- SoundCloud — medium discovery, low-med community -->
  <circle cx="430" cy="310" r="18" fill="#ff5500" opacity="0.15" stroke="#ff5500" stroke-width="1.5" stroke-opacity="0.5"/>
  <text x="430" y="315" font-size="11" fill="#ff5500" font-weight="600" text-anchor="middle">SC</text>
  <text x="430" y="342" font-size="12" fill="#a04020" text-anchor="middle">SoundCloud</text>

  <!-- FanBand — the gap: high community, med-high discovery -->
  <circle cx="580" cy="138" r="36" fill="#b794f4" opacity="0.22" stroke="#b794f4" stroke-width="2"/>
  <text x="580" y="132" font-size="14" fill="#d4b8ff" font-weight="700" text-anchor="middle">FanBand</text>
  <text x="580" y="150" font-size="11" fill="#b794f4" text-anchor="middle">early-stage focus</text>

  <!-- Gap annotation -->
  <rect x="590" y="86" width="148" height="30" rx="3" fill="#1e1830" stroke="#b794f4" stroke-width="1" stroke-opacity="0.5"/>
  <text x="664" y="106" font-size="12" fill="#d4b8ff" text-anchor="middle" font-weight="500">The unoccupied gap</text>
  <line x1="590" y1="101" x2="578" y2="118" stroke="#b794f4" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Quadrant labels -->
  <text x="344" y="228" font-size="11" fill="#2a2440" text-anchor="middle" font-weight="600">NICHE &amp; DEEP</text>
  <text x="680" y="228" font-size="11" fill="#2a2440" text-anchor="middle" font-weight="600">SCALE &amp; SHALLOW</text>

  <text x="450" y="444" font-size="11" fill="#3a3050" text-anchor="middle">FanBand — Platform landscape: the quadrant that existing platforms don't serve</text>
</svg>
