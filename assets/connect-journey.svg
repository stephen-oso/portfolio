<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif">
  <defs>
    <clipPath id="cs"><rect x="105" y="47" width="150" height="406" rx="12"/></clipPath>
    <filter id="sh" x="-25%" y="-8%" width="150%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0a2a1e" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="500" fill="#edf7f3"/>
  <circle cx="320" cy="440" r="100" fill="#d5ede3" opacity="0.45"/>
  <circle cx="40" cy="60" r="70" fill="#d5ede3" opacity="0.4"/>

  <!-- Phone frame -->
  <rect x="98" y="40" rx="22" width="164" height="420" fill="#111" filter="url(#sh)"/>
  <rect x="105" y="47" rx="12" width="150" height="406" fill="#fff"/>
  <rect x="150" y="47" rx="3" width="58" height="5" fill="#0d0d0d"/>

  <g clip-path="url(#cs)">
    <!-- Status bar -->
    <rect x="105" y="47" width="150" height="14" fill="#f9fafb"/>
    <text x="114" y="58" font-size="7" font-weight="600" fill="#1f2937">9:41</text>
    <rect x="238" y="52" rx="1.5" width="11" height="5" fill="#9ca3af"/>
    <rect x="232" y="53" rx="1" width="5" height="3" fill="#9ca3af"/>

    <!-- Schedule header -->
    <rect x="105" y="61" width="150" height="30" fill="#fff"/>
    <text x="180" y="75" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">Schedule</text>
    <text x="180" y="86" font-size="6" fill="#6b7280" text-anchor="middle">Your booked street performances</text>
    <!-- + button -->
    <circle cx="248" cy="73" r="9" fill="#1a6b5a"/>
    <text x="248" y="78" font-size="13" font-weight="300" fill="#fff" text-anchor="middle">+</text>

    <!-- Month navigation -->
    <circle cx="116" cy="101" r="8" fill="#f3f4f6"/>
    <text x="116" y="105.5" font-size="10" fill="#374151" text-anchor="middle">&#x2039;</text>
    <text x="180" y="105" font-size="9" font-weight="600" fill="#111827" text-anchor="middle">July 2026</text>
    <circle cx="244" cy="101" r="8" fill="#f3f4f6"/>
    <text x="244" y="105.5" font-size="10" fill="#374151" text-anchor="middle">&#x203A;</text>

    <!-- Day headers: Su Mo Tu We Th Fr Sa -->
    <!-- col centers: 116, 137, 158, 179, 200, 221, 242 -->
    <text x="116" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">Su</text>
    <text x="137" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">Mo</text>
    <text x="158" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">Tu</text>
    <text x="179" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">We</text>
    <text x="200" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">Th</text>
    <text x="221" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">Fr</text>
    <text x="242" y="121" font-size="6.5" fill="#9ca3af" text-anchor="middle" font-weight="500">Sa</text>

    <!-- Calendar rows — July 2026: July 1 = Wednesday -->
    <!-- Row 1: 1(We),2(Th),3(Fr),4(Sa) -->
    <text x="179" y="137" font-size="7.5" fill="#374151" text-anchor="middle">1</text>
    <text x="200" y="137" font-size="7.5" fill="#374151" text-anchor="middle">2</text>
    <text x="221" y="137" font-size="7.5" fill="#374151" text-anchor="middle">3</text>
    <text x="242" y="137" font-size="7.5" fill="#374151" text-anchor="middle">4</text>
    <!-- Row 2: 5-11 -->
    <text x="116" y="158" font-size="7.5" fill="#374151" text-anchor="middle">5</text>
    <text x="137" y="158" font-size="7.5" fill="#374151" text-anchor="middle">6</text>
    <text x="158" y="158" font-size="7.5" fill="#374151" text-anchor="middle">7</text>
    <text x="179" y="158" font-size="7.5" fill="#374151" text-anchor="middle">8</text>
    <text x="200" y="158" font-size="7.5" fill="#374151" text-anchor="middle">9</text>
    <text x="221" y="158" font-size="7.5" fill="#374151" text-anchor="middle">10</text>
    <text x="242" y="158" font-size="7.5" fill="#374151" text-anchor="middle">11</text>
    <!-- Row 3: 12-18 -->
    <text x="116" y="179" font-size="7.5" fill="#374151" text-anchor="middle">12</text>
    <text x="137" y="179" font-size="7.5" fill="#374151" text-anchor="middle">13</text>
    <text x="158" y="179" font-size="7.5" fill="#374151" text-anchor="middle">14</text>
    <text x="179" y="179" font-size="7.5" fill="#374151" text-anchor="middle">15</text>
    <text x="200" y="179" font-size="7.5" fill="#374151" text-anchor="middle">16</text>
    <text x="221" y="179" font-size="7.5" fill="#374151" text-anchor="middle">17</text>
    <text x="242" y="179" font-size="7.5" fill="#374151" text-anchor="middle">18</text>
    <!-- Row 4: 19-25 -->
    <text x="116" y="200" font-size="7.5" fill="#374151" text-anchor="middle">19</text>
    <text x="137" y="200" font-size="7.5" fill="#374151" text-anchor="middle">20</text>
    <text x="158" y="200" font-size="7.5" fill="#374151" text-anchor="middle">21</text>
    <text x="179" y="200" font-size="7.5" fill="#374151" text-anchor="middle">22</text>
    <text x="200" y="200" font-size="7.5" fill="#374151" text-anchor="middle">23</text>
    <text x="221" y="200" font-size="7.5" fill="#374151" text-anchor="middle">24</text>
    <text x="242" y="200" font-size="7.5" fill="#374151" text-anchor="middle">25</text>
    <!-- Row 5: 26-31 (31 = Friday, col index 5 = x=221) -->
    <text x="116" y="221" font-size="7.5" fill="#374151" text-anchor="middle">26</text>
    <text x="137" y="221" font-size="7.5" fill="#374151" text-anchor="middle">27</text>
    <text x="158" y="221" font-size="7.5" fill="#374151" text-anchor="middle">28</text>
    <text x="179" y="221" font-size="7.5" fill="#374151" text-anchor="middle">29</text>
    <text x="200" y="221" font-size="7.5" fill="#374151" text-anchor="middle">30</text>
    <!-- Day 31 highlighted -->
    <circle cx="221" cy="217" r="10" fill="#1a6b5a"/>
    <text x="221" y="221" font-size="7.5" font-weight="600" fill="#fff" text-anchor="middle">31</text>

    <!-- Upcoming Shows -->
    <text x="113" y="244" font-size="8" font-weight="600" fill="#111827">Upcoming Shows</text>

    <!-- Empty state -->
    <rect x="113" y="252" rx="8" width="134" height="70" fill="#f9fafb"/>
    <text x="180" y="282" font-size="7" fill="#374151" text-anchor="middle">No shows booked yet.</text>
    <text x="180" y="294" font-size="6" fill="#9ca3af" text-anchor="middle">Find a venue and book your next</text>
    <text x="180" y="304" font-size="6" fill="#9ca3af" text-anchor="middle">street performance.</text>

    <!-- Book a New Spot button -->
    <rect x="113" y="332" rx="12" width="134" height="28" fill="#1a6b5a"/>
    <!-- Location pin icon -->
    <circle cx="130" cy="346" r="5" fill="#fff" opacity="0.9"/>
    <circle cx="130" cy="346" r="2.5" fill="#1a6b5a"/>
    <text x="189" y="350" font-size="8" font-weight="600" fill="#fff" text-anchor="middle">Book a New Spot</text>

    <!-- Bottom nav -->
    <rect x="105" y="435" width="150" height="18" fill="#fff"/>
    <line x1="105" y1="435" x2="255" y2="435" stroke="#e5e7eb" stroke-width="0.5"/>
    <!-- centers: 120, 150, 180, 210, 240 -->
    <text x="120" y="448" font-size="9" fill="#d1d5db" text-anchor="middle">&#x2302;</text>
    <!-- Schedule active -->
    <text x="150" y="447" font-size="9" fill="#1a6b5a" text-anchor="middle">&#x25A6;</text>
    <text x="150" y="453" font-size="4.5" fill="#1a6b5a" text-anchor="middle">Schedule</text>
    <text x="180" y="448" font-size="9" fill="#d1d5db" text-anchor="middle">&#x2295;</text>
    <text x="210" y="448" font-size="9" fill="#d1d5db" text-anchor="middle">&#x25C8;</text>
    <text x="240" y="448" font-size="9" fill="#d1d5db" text-anchor="middle">&#x25CE;</text>
  </g>
</svg>
