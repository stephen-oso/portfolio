<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <radialGradient id="vglow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#3a3020" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#060608" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#8a7440" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8a7440" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Base -->
  <rect width="900" height="600" fill="#060608"/>
  <rect width="900" height="600" fill="url(#vglow)"/>
  <rect width="900" height="600" fill="url(#spot)"/>

  <!-- Top bar — operator UI -->
  <rect width="900" height="48" fill="#0e0e10"/>
  <rect y="48" width="900" height="1" fill="#1e1e22"/>
  <text x="28" y="29" font-family="DM Sans, sans-serif" font-size="11" font-weight="600" letter-spacing="3" fill="#5a5a60">VERSECUE</text>
  <circle cx="820" cy="24" r="5" fill="#22c55e"/>
  <text x="832" y="29" font-family="DM Sans, sans-serif" font-size="10" fill="#5a5a60">Live</text>
  <rect x="740" y="12" width="62" height="24" rx="4" fill="#1a1a1e" stroke="#2a2a2e" stroke-width="1"/>
  <text x="771" y="28" font-family="DM Sans, sans-serif" font-size="10" fill="#5a5a60" text-anchor="middle">ESV</text>

  <!-- Horizontal rules flanking verse -->
  <rect x="28" y="185" width="360" height="1" fill="#1e1e22"/>
  <rect x="512" y="185" width="360" height="1" fill="#1e1e22"/>

  <!-- Main verse display — centered -->
  <text x="450" y="180" font-family="Georgia, serif" font-size="11" fill="#4a4a50" text-anchor="middle" letter-spacing="3">JOHN 14 : 6</text>

  <text x="450" y="248" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#e8e4dc" text-anchor="middle">"I am the way, the truth,</text>
  <text x="450" y="296" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#e8e4dc" text-anchor="middle">and the life."</text>

  <text x="450" y="340" font-family="Georgia, serif" font-size="14" fill="#5a5a50" text-anchor="middle">— Jesus, John 14:6 (ESV)</text>

  <!-- Horizontal rules after verse -->
  <rect x="28" y="368" width="360" height="1" fill="#1e1e22"/>
  <rect x="512" y="368" width="360" height="1" fill="#1e1e22"/>

  <!-- Bottom operator panel -->
  <rect y="430" width="900" height="170" fill="#0a0a0c"/>
  <rect y="430" width="900" height="1" fill="#1e1e22"/>

  <text x="28" y="458" font-family="DM Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="2" fill="#3a3a40">QUEUE</text>

  <!-- Queue items -->
  <rect x="28" y="468" width="840" height="46" rx="6" fill="#0f0f12" stroke="#e8e4dc" stroke-width="1" stroke-opacity="0.12"/>
  <rect x="28" y="468" width="3" height="46" rx="1" fill="#8a7440"/>
  <text x="46" y="487" font-family="DM Sans, sans-serif" font-size="9" font-weight="600" fill="#9a9490">NOW DISPLAYING</text>
  <text x="46" y="503" font-family="Georgia, serif" font-size="11" fill="#e8e4dc">John 14:6 — "I am the way, the truth, and the life."</text>

  <rect x="28" y="522" width="840" height="36" rx="6" fill="#0c0c0e"/>
  <text x="46" y="536" font-family="DM Sans, sans-serif" font-size="8" fill="#3a3a40">NEXT</text>
  <text x="46" y="550" font-family="Georgia, serif" font-size="10" fill="#4a4a50">Psalm 23:1 — "The Lord is my shepherd; I shall not want."</text>

  <rect x="28" y="564" width="840" height="28" rx="6" fill="#0a0a0c"/>
  <text x="46" y="583" font-family="Georgia, serif" font-size="10" fill="#2e2e34">Romans 8:28 — "And we know that in all things God works for the good..."</text>

  <!-- AI badge -->
  <rect x="748" y="440" width="120" height="22" rx="4" fill="#1a1a1e"/>
  <text x="758" y="455" font-family="DM Sans, sans-serif" font-size="9" fill="#8a7440">⬡ AI suggestion on</text>
</svg>
