  <!-- Project pills -->
  <rect x="100" y="374" width="140" height="32" rx="4" fill="#1e1e1c" stroke="#2a2a28" stroke-width="1"/>
  <text x="170" y="395" font-size="13" fill="#6a6a64" font-family="'DM Sans', system-ui, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="0.06em">QUICKFIT</text>

  <rect x="252" y="374" width="180" height="32" rx="4" fill="#1e1e1c" stroke="#2a2a28" stroke-width="1"/>
  <text x="342" y="395" font-size="13" fill="#6a6a64" font-family="'DM Sans', system-ui, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="0.06em">CONNECT TORONTO</text>

  <rect x="444" y="374" width="120" height="32" rx="4" fill="#1e1e1c" stroke="#2a2a28" stroke-width="1"/>
  <text x="504" y="395" font-size="13" fill="#6a6a64" font-family="'DM Sans', system-ui, sans-serif" font-weight="600" text-anchor="middle" letter-spacing="0.06em">FANBAND</text>

