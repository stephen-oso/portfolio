  <text x="100" y="268" font-size="72" fill="#f9f9f7" font-weight="700" letter-spacing="-0.02em">Stephen Okulaja</text>

  <!-- Rule -->
  <line x1="100" y1="296" x2="700" y2="296" stroke="#2a2a28" stroke-width="1"/>

